[project]
name = "semi2644"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pandas>=3,<4",
  "numpy",
  "scipy",
  "pyarrow",
  "pyyaml",
  "exchange_calendars>=4.13,<5",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
